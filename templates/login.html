<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация - Discord Log Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename="favico.ico") }}" type="image/x-icon">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center">
    <div class="card bg-secondary text-light shadow-lg">
        <div class="card-body">
            <h3 class="card-title text-center text-primary me-2">Вход</h3>
            <form method="post">
                <div class="text-start mb-2">
                    <label for="username" class="form-label">Логин</label>
                    <input type="text" class="form-control bg-dark text-light" id="username" name="username" placeholder="Ваш @username" required>
                </div>
                <div class="text-start mb-2">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control bg-dark text-light" id="password" name="password" placeholder="Отправленный в личку" required>
                </div>
                {% if error %}
                    <div class="alert alert-danger" role="alert">
                        {{ error }}
                    </div>
                {% endif %}
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
        </div>
    </div>
</body>
</html>
