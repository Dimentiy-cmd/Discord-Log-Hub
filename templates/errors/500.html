<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Внутренняя ошибка сервера - Discord Log Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-secondary border-danger">
                    <div class="card-body p-5">
                        <div class="mb-4">
                            <i class="bi bi-exclamation-octagon-fill text-danger" style="font-size: 4rem;"></i>
                        </div>
                        <h1 class="card-title text-danger display-4 mb-3">500</h1>
                        <h2 class="card-subtitle text-light mb-4">Внутренняя ошибка сервера</h2>
                        <p class="text-muted mb-4">
                            Произошла непредвиденная ошибка. Попробуйте обновить страницу или повторить запрос позже.
                        </p>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{{ url_for('index') }}" class="btn btn-primary">
                                <i class="bi bi-house-fill me-2"></i>
                                На главную
                            </a>
                            <button onclick="location.reload()" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-clockwise me-2"></i>
                                Обновить
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
