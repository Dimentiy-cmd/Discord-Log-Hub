<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логи — Discord Log Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename="favico.ico") }}" type="image/x-icon">
</head>
<body class="bg-dark text-light">
    {% include 'includes/header.html' %}
    <div class="container-fluid">
        <div class="row">
            {% include 'includes/sidebar.html' %}
            <main class="col-md-9 col-lg-10 px-md-4 py-4">
                <section>
                    <h2 class="h4 mb-4 text-primary"><i class="bi bi-journal-text me-2"></i> Категории логов</h2>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <a href="{{ url_for('logs_messages') }}" class="text-decoration-none">
                                <div class="card bg-secondary text-white h-100">
                                    <div class="card-body">
                                        <h5 class="card-title"><i class="bi bi-chat-fill me-2"></i></i>Логирование сообщений</h5>
                                    </div>
                                </div>
                            </a>
                        </div>
                        <div class="col-md-4">
                            <a href="{{ url_for('logs_members') }}" class="text-decoration-none">
                                <div class="card bg-secondary text-white h-100">
                                    <div class="card-body">
                                        <h5 class="card-title"><i class="bi bi-people-fill me-2"></i>Логирование участников</h5>
                                    </div>
                                </div>
                            </a>
                        </div>
                        <div class="col-md-4">
                            <a href="{{ url_for('logs_server') }}" class="text-decoration-none">
                                <div class="card bg-secondary text-white h-100">
                                    <div class="card-body">
                                        <h5 class="card-title"><i class="bi bi-discord me-2"></i>Логирование сервера</h5>
                                    </div>
                                </div>
                            </a>
                        </div>
                        <div class="col-md-4">
                            <a href="{{ url_for('logs_other') }}" class="text-decoration-none">
                                <div class="card bg-secondary text-white">
                                    <div class="card-body">
                                        <h5 class="card-title"><i class="bi bi-three-dots me-2"></i>Прочее</h5>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
